apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-shop
spec:
  selector:
    matchLabels:
      app: fake-shop
  template:
    metadata:
      labels:
        app: fake-shop
    spec:
      containers:
      - name: fake-shop
        image: thefly72003/fake-shop:v1
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 5000
        env:
          - name: DB_USER
            value: ecommerce
          - name: DB_HOST
            value: postgres
          - name: DB_PASSWORD
            value: Pg1234
          - name: DB_NAME
            value: ecommerce
          - name: FLASK_APP
            value: index.py
